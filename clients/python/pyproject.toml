[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zigbase"
version = "0.1.0"
description = "Official Python client for ZigBase - REST, auth, cursor pagination, and files."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "David J Parrott", email = "valthon@nothlav.net" }]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# `pydantic` is also in `dev`: the golden-import test (tests/codegen/) exercises a
# generated typed client, which needs the `typed` tier's runtime dependency present
# in the dev environment even for a consumer who never opts into `[typed]`.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13", "pydantic>=2"]
realtime = ["websockets>=13"]
typed = ["pydantic>=2"]

[project.urls]
Repository = "https://github.com/valthon/zigbase"

[tool.hatch.build.targets.wheel]
packages = ["src/zigbase"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"

# `websockets` (the `zigbase[realtime]` extra) IS installed in CI's mypy job
# (it runs against `.[dev,realtime]`), so this override is a no-op there --
# it remains as a safety net for a plain `.[dev]` mypy/CI environment, where
# `websockets` is absent: realtime.py's default connector imports it lazily
# at runtime, but the TYPE_CHECKING import used for the adapter's
# annotations still needs resolving statically either way.
[[tool.mypy.overrides]]
module = "websockets.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a zigbase server binary (ZIGBASE_TEST_BINARY)"]
