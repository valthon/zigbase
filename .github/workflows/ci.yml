name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      # All zig builds in this job (main + every example, via inherited env) share
      # ONE local cache dir, which is persisted across runs below. This is where the
      # compiled vendored SQLite object actually lives.
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Global cache holds toolchain-shared artifacts (compiler_rt, translate-c, libc).
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      # Local cache holds the compiled SQLite amalgamation (the dominant clean-build
      # cost — ~5-8s per `zig build`, recompiled for each example without this) plus
      # every other build object. The sha-suffixed key writes a fresh entry each run;
      # restore-keys fuzzy-match the most recent, and zig's content-addressed cache
      # reuses any unchanged object (sqlite3.o) even when other sources changed.
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-build-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-build-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-build-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Build plugins example frontend (embedded into the plugins binary)
        run: cd examples/plugins/frontend && mise exec node@24 -- npm ci --no-audit --no-fund && mise exec node@24 -- npm run build
      # Shared binaries are built once here and run on OTHER jobs' runners, so they
      # must target a portable CPU — zig's default is -mcpu=native, which can emit
      # instructions a different runner lacks (→ SIGILL on startup). -Dcpu=baseline
      # keeps them runnable on any x86_64 runner. (gen-*-check below run the generator
      # on THIS runner, so they don't need it.)
      - name: Build main zigbase binary
        run: mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build blog example consumer (dependency-graph proof)
        run: cd examples/blog && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      # The examples are also the reference for how a consumer tests their app,
      # so blog's in-process suite runs in CI rather than only compiling.
      - name: Blog example in-process tests (zigbase.testing)
        run: cd examples/blog && mise exec zig@0.16.0 -- zig build test --summary all
      - name: Build golfsim example consumer (realistic app)
        run: cd examples/golfsim && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      # golfsim's `.static_files` dir is comptime-hardcoded (not --serve-static), so the app
      # — including zigbase.testing's socketless boot below — refuses to boot at all unless
      # frontend/dist already exists. Build it first (mirrors harness.ts's ensureFrontend()).
      - name: Golfsim example in-process tests (zigbase.testing)
        run: |
          cd examples/golfsim/frontend
          mise exec node@24 -- npm ci --no-audit --no-fund
          mise exec node@24 -- npm run build
          cd ../
          mise exec zig@0.16.0 -- zig build test --summary all
      - name: Build dating-server (e2e fixture binary)
        run: mise exec zig@0.16.0 -- zig build dating-server -Dcpu=baseline
      - name: Build auth2-server (e2e fixture binary)
        run: mise exec zig@0.16.0 -- zig build auth2-server -Dcpu=baseline
      - name: Build features-fixture (demo flags/experiments browser fixture)
        run: mise exec zig@0.16.0 -- zig build features-fixture -Dcpu=baseline
      - name: Build import-fixture (offline-import e2e fixture, #283)
        run: mise exec zig@0.16.0 -- zig build import-fixture -Dcpu=baseline
      - name: Build lean gating fixture
        run: mise exec zig@0.16.0 -- zig build minimal-server
      - name: Build full gating fixture (positive control; also the browser suite's analytics-enabled fixture)
        run: mise exec zig@0.16.0 -- zig build full-fixture -Dcpu=baseline
      - name: Gating invariant (absent-symbols check)
        run: ./scripts/check-gating.sh
      - name: Allocator ownership contracts (ratchet)
        run: ./scripts/check-allocator-contracts.sh
      - name: Error-code ledger is append-only
        # actions/checkout leaves a depth-1 clone: HEAD (the PR merge commit) has
        # no reachable ancestry, so a bare fetch of the base ref alone leaves
        # `git merge-base origin/main HEAD` with disjoint histories and the check
        # dies before it can diff anything. Fetch main's full history AND deepen
        # HEAD's own line far enough to reach the fork point. The doctor-ledger
        # step below reuses the deepened clone this one already produced.
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags --deepen=200 origin
          ./scripts/check-error-code-ledger.sh origin/main
      - name: Doctor check-id ledger is append-only
        # actions/checkout leaves a depth-1 clone: HEAD (the PR merge commit) has
        # no reachable ancestry, so a bare fetch of the base ref alone leaves
        # `git merge-base origin/main HEAD` with disjoint histories and the check
        # dies before it can diff anything. Fetch main's full history AND deepen
        # HEAD's own line far enough to reach the fork point.
        #
        # Deliberately repeats the fetch that a neighbouring ledger step also
        # performs, rather than relying on that step having run first: on an
        # already-deepened clone the repeat costs about a second, whereas the
        # deduplicated form would make THIS guard's correctness depend on another
        # step's presence and ordering — a silent breakage nobody would predict
        # when editing that other step. This check exists precisely to not be
        # silently defeated (it already died once, invisibly, in a shallow clone).
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags --deepen=200 origin
          ./scripts/check-doctor-ledger.sh origin/main
      - name: Dating client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-client-check
      - name: Dating runtime client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-runtime-client-check
      # Format-then-diff so the comparison can never fail on formatter style alone.
      # --language-version pins the formatter's style (short, matching the package's
      # `sdk: ^3.5.0` in clients/dart/pubspec.yaml) because this job never runs
      # `dart pub get`, and without a package config `dart format` silently falls
      # back to the LATEST language version (tall style) — a pure-formatting diff.
      - name: Dating Dart client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-dart-client
          mise exec dart@3.12 -- dart format --language-version=3.5 clients/dart/test/codegen/dating/zbase.gen.dart
          git diff --exit-code clients/dart/test/codegen/dating/zbase.gen.dart
      # Same format-then-diff shape as the Dart snapshot above: the Python
      # golden is committed `ruff format`-clean, and the raw generator output
      # differs from it only in blank-line normalization, so a byte-exact
      # `--check` (unlike the TS/runtime `gen-*-check` steps) would false-
      # positive on formatting alone. `ruff` is installed standalone here
      # (not the full `zigbase[dev]` extra) since this job only needs the
      # formatter, not the whole python-sdk toolchain (see the `python-sdk`
      # job below for that). Version pinned for the same reason the Dart
      # snapshot's `--language-version` above is pinned: this job never runs
      # `pip install -e clients/python[dev]`, so nothing else constrains the
      # version, and an unpinned `pip install ruff` could silently pick up a
      # newer release whose formatter disagrees with the one that produced
      # the committed golden — a pure tooling-version diff, not a real
      # regression. Bump deliberately alongside `clients/python/pyproject.toml`'s
      # `ruff>=0.8` dev-extra floor.
      - name: Dating Python client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-python-client
          mise exec python@3.13 -- python -m pip install --quiet ruff==0.15.21
          mise exec python@3.13 -- python -m ruff format clients/python/tests/codegen/dating/zbase_gen.py
          git diff --exit-code clients/python/tests/codegen/dating/zbase_gen.py
      # Same format-then-diff shape as the Dart/Python snapshots above: the
      # committed Kotlin golden is Spotless (ktlint)-clean, but the raw
      # generator output isn't formatted (compact form), so a byte-exact
      # `--check` would false-positive on formatting alone. `spotlessApply`
      # normalizes the regenerated file to exactly what a fresh, correct
      # golden looks like; the scoped `--exit-code` diff then fails only on a
      # real semantic drift (an emitter change that wasn't regenerated).
      - name: Dating Kotlin client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-kotlin-client
          mise exec gradle@9.6 -- gradle -p clients/kotlin spotlessApply
          git diff --exit-code clients/kotlin/src/test/kotlin/io/github/valthon/zigbase/codegen/dating/ZbaseGen.kt
      - name: Golfsim client snapshot is fresh
        working-directory: examples/golfsim
        run: mise exec zig@0.16.0 -- zig build gen-client-check
      - name: Build plugins example consumer (advanced framework surface)
        run: cd examples/plugins && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v7
        with:
          name: zigbase-binaries
          path: |
            zig-out/bin/zigbase
            zig-out/bin/dating-server
            zig-out/bin/auth2-server
            zig-out/bin/features-fixture
            zig-out/bin/import-fixture
            zig-out/bin/full-fixture
            examples/blog/zig-out/bin/blog
            examples/golfsim/zig-out/bin/golfsim
            examples/plugins/zig-out/bin/plugins
          if-no-files-found: error
          retention-days: 1

  unit:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      # Persists the compiled SQLite object (and the test binary) across runs — see the
      # build job for rationale. Separate key prefix: the test binary differs from the
      # build job's artifacts, so they don't share cache entries.
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-unit-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-unit-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-unit-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-
      - name: Formatting gate (zig fmt --check)
        run: mise exec zig@0.16.0 -- zig fmt --check src build.zig
      - name: Unit tests
        run: mise exec zig@0.16.0 -- zig build test --summary all
      - name: Compile fuzz harnesses
        run: mise exec zig@0.16.0 -- zig build fuzz-compile --summary all
      - name: "Unit tests (prod gate: -Ddev-mode=false)"
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ddev-mode=false
      # Lean-build gate (R2-6): -Dfts5=false must still COMPILE — the whole point is that FTS5 (and
      # SQLite's -DSQLITE_ENABLE_FTS5) folds out of a build that never declares a `.searchable`
      # field. Build-only, not a full test run: a handful of pre-existing fixtures (policy.zig,
      # rewrap.zig, codegen/typegen_cli.zig) construct a searchable collection unconditionally and
      # would need their own -Dfts5-awareness to pass here — the comptime-dead-code guarantee and
      # fts.zig's own "enabled reflects build_options" test are what this flag actually needs proven.
      - name: "Build check: -Dfts5=false (lean build without SQLite FTS5)"
        run: mise exec zig@0.16.0 -- zig build -Dfts5=false

  # Opt-in PostgreSQL backend (#159). Runs the full suite WITH -Dpostgres=true against a
  # real postgres service container, exercising the pure-Zig wire driver's SCRAM-SHA-256
  # auth + extended-protocol query/transaction/pool tests. The container forces SCRAM
  # (POSTGRES_HOST_AUTH_METHOD=scram-sha-256); ZIGBASE_PG_TEST_URL points the live tests at
  # it. The default SQLite jobs above are untouched, so the default story can't regress.
  postgres:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      # sslmode=prefer: the stock postgres image has no server TLS, so the driver negotiates
      # SSLRequest and transparently falls back to plaintext. SCRAM is still exercised here;
      # TLS-handshake + verification coverage runs in the postgres-tls job.
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=prefer
      # No server TLS in this job: gates the live test asserting the DEFAULT (verify-full)
      # refuses a plaintext-only server with the actionable "server refused TLS" error.
      ZIGBASE_PG_PLAINTEXT: "1"
    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension AVAILABLE (#159, PR-11), so
        # the -Dvector live tests can `CREATE EXTENSION vector` (POSTGRES_USER is a superuser here)
        # and exercise the pgvector KNN lowering. Identical env/health to the stock postgres:16.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zbpg
          POSTGRES_PASSWORD: zbpg_secret_pw
          POSTGRES_DB: zbpgtest
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zbpg -d zbpgtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-
      # -Dvector=true so the live pgvector KNN parity + tenant/ability chokepoint tests run too
      # (sqlite-vec is also compiled in; the SQLite vector tests run alongside). The pgvector image
      # above makes `CREATE EXTENSION vector` succeed for the superuser test role.
      - name: Unit + PostgreSQL driver tests (-Dpostgres=true -Dvector=true)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true -Dvector=true

  # PostgreSQL with server TLS, so the suite runs over a REAL sslmode=require connection —
  # exercising the TLS handshake, the dual-layer flushOut, and TLS partial-read framing (the
  # exact area a flush hang already bit). The stock service-container image has no TLS, so we
  # run our own PG via `docker run` with a generated self-signed cert + scram-sha-256.
  postgres-tls:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=require
      # Points the live verify-full tests at the self-signed server cert generated below.
      ZIGBASE_PG_TLS_CA: ${{ github.workspace }}/pgtls/server.crt
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-
      - name: Start PostgreSQL with server TLS + SCRAM
        run: |
          mkdir -p "$PWD/pgtls"
          openssl req -new -x509 -days 2 -nodes -text \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -out "$PWD/pgtls/server.crt" -keyout "$PWD/pgtls/server.key"
          chmod 600 "$PWD/pgtls/server.key"
          # The postgres image runs as uid 999; it must own the key to load it.
          sudo chown 999:999 "$PWD/pgtls/server.crt" "$PWD/pgtls/server.key"
          docker run -d --name pgtls \
            -e POSTGRES_USER=zbpg -e POSTGRES_PASSWORD=zbpg_secret_pw -e POSTGRES_DB=zbpgtest \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 5432:5432 \
            -v "$PWD/pgtls/server.crt":/etc/pgtls/server.crt:ro \
            -v "$PWD/pgtls/server.key":/etc/pgtls/server.key:ro \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/etc/pgtls/server.crt -c ssl_key_file=/etc/pgtls/server.key
          # Wait until the server accepts connections.
          for i in $(seq 1 30); do
            if docker exec pgtls pg_isready -U zbpg -d zbpgtest >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done
          # Sanity: confirm SSL is actually on.
          docker exec pgtls psql -U zbpg -d zbpgtest -tAc "SHOW ssl;"
      - name: Unit + PostgreSQL driver tests over TLS (sslmode=require)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pgtls || true

  # Opt-in S3 storage backend (§D). Builds and tests with -Ds3=true against a real
  # MinIO started via `docker run` (the services: block can't pass the `server /data`
  # command — same reason postgres-tls uses docker run). The default jobs above keep
  # the stock flags, so both configurations compile on every PR (the postgres two-
  # config precedent).
  s3:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      ZIGBASE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      ZIGBASE_S3_TEST_BUCKET: zbtest
      ZIGBASE_S3_TEST_KEY: minioadmin
      ZIGBASE_S3_TEST_SECRET: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-s3-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-s3-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-s3-${{ runner.os }}-zig0.16.0-${{ github.ref_name }}-
      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready >/dev/null 2>&1; then
              echo "minio ready"; break
            fi
            sleep 2
          done
          docker run --rm --network host --entrypoint sh minio/mc:latest -c \
            "mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb local/zbtest"
      - name: Unit + live S3 tests (-Ds3=true)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ds3=true
      - name: Build zigbase (-Ds3=true) for the raw-HTTP e2e
        run: mise exec zig@0.16.0 -- zig build -Ds3=true -Dcpu=baseline
      - name: S3 end-to-end (upload -> Range/304/416 -> delete)
        run: |
          mise exec python@3.13 -- python -m pip install --quiet pytest
          ZIGBASE_TEST_BINARY="$PWD/zig-out/bin/zigbase" \
            mise exec python@3.13 -- python -m pytest tests/s3 -q
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: zigbase-binaries
          path: artifacts
      - name: Export prebuilt binary paths
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/zig-out/bin/auth2-server \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_AUTH2_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/auth2-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/features-fixture
          echo "ZIGBASE_FEATURES_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/features-fixture" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/import-fixture
          echo "ZIGBASE_TEST_IMPORT_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/import-fixture" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/full-fixture
          echo "ZIGBASE_TEST_FULL_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/full-fixture" >> "$GITHUB_ENV"
      - name: Install Python test deps + resolve Playwright version
        id: pw
        run: |
          mise exec python@3.13 -- python -m pip install --quiet pytest pytest-xdist playwright aiosmtpd
          echo "version=$(mise exec python@3.13 -- python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser (chromium headless shell)
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium headless shell + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mise exec python@3.13 -- python -m playwright install --with-deps --only-shell chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mise exec python@3.13 -- python -m playwright install-deps chromium
      - name: Headless browser tests
        # -n auto parallelizes across the runner's vCPUs (each test binds its own
        # free port + tempdir, so the harness is parallel-safe). Keep tests/smtp
        # serial below — it binds a real fixed TLS port.
        run: mise exec python@3.13 -- python -m pytest tests/admin -q -n auto
      - name: Server lifecycle + doctor CLI e2e
        # Serial on purpose: these tests assert on timing (the readiness
        # handshake, the child-death path, the TERM/KILL escalation) and on
        # process-table state, which -n auto makes flaky for reasons unrelated
        # to the code. No browser or Playwright involvement.
        run: mise exec python@3.13 -- python -m pytest tests/cli -q
      - name: Replay-harness unit tests
        run: mise exec python@3.13 -- python -m pytest tests/tools -q
      - name: Live SMTP-over-TLS (STARTTLS) delivery test
        run: mise exec python@3.13 -- python -m pytest tests/smtp -q

  ts-sdk:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: zigbase-binaries
          path: artifacts
      - name: Export prebuilt binary path
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/zig-out/bin/dating-server \
                   artifacts/zig-out/bin/auth2-server \
                   artifacts/examples/golfsim/zig-out/bin/golfsim \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_DATING_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/dating-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_AUTH2_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/auth2-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_GOLFSIM_BINARY=$GITHUB_WORKSPACE/artifacts/examples/golfsim/zig-out/bin/golfsim" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install SDK deps
        working-directory: clients/typescript
        run: mise exec node@24 -- npm ci || mise exec node@24 -- npm install
      - name: Typecheck
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run typecheck
      - name: Unit tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm test
      - name: Integration tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run test:integration
      - name: Build @zigbase/client (golfsim consumes the built package)
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run build
      - name: Golfsim e2e
        working-directory: examples/golfsim
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Blog e2e (base SDK)
        working-directory: examples/blog
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Plugins typegen e2e (runtime SDK)
        working-directory: examples/plugins
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Server package generator unit test
        run: cd clients/typescript/npm && mise exec node@24 -- node --test gen-server-packages.test.mjs
      # Packs the bare `zigbase` alias + @zigbase/server + a stub platform package
      # into tarballs and installs them. No zig build, and no registry access
      # (a dead registry / an empty offline cache proves resolution stays local).
      - name: Bare `zigbase` alias install test
        run: cd clients/typescript/npm && mise exec node@24 -- node --test test-alias-install.mjs

