name: CI
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      # All zig builds in this job (main + every example, via inherited env) share
      # ONE local cache dir, which is persisted across runs below. This is where the
      # compiled vendored SQLite object actually lives.
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      # Global cache holds toolchain-shared artifacts (compiler_rt, translate-c, libc).
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      # Local cache holds the compiled SQLite amalgamation (the dominant clean-build
      # cost — ~5-8s per `zig build`, recompiled for each example without this) plus
      # every other build object. The sha-suffixed key writes a fresh entry each run;
      # restore-keys fuzzy-match the most recent, and zig's content-addressed cache
      # reuses any unchanged object (sqlite3.o) even when other sources changed.
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-build-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-build-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-build-${{ runner.os }}-zig0.16.0-
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Build plugins example frontend (embedded into the plugins binary)
        run: cd examples/plugins/frontend && mise exec node@24 -- npm ci --no-audit --no-fund && mise exec node@24 -- npm run build
      # Shared binaries are built once here and run on OTHER jobs' runners, so they
      # must target a portable CPU — zig's default is -mcpu=native, which can emit
      # instructions a different runner lacks (→ SIGILL on startup). -Dcpu=baseline
      # keeps them runnable on any x86_64 runner. (gen-*-check below run the generator
      # on THIS runner, so they don't need it.)
      - name: Build main zigbase binary
        run: mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build blog example consumer (dependency-graph proof)
        run: cd examples/blog && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build golfsim example consumer (realistic app)
        run: cd examples/golfsim && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build dating-server (e2e fixture binary)
        run: mise exec zig@0.16.0 -- zig build dating-server -Dcpu=baseline
      - name: Dating client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-client-check
      - name: Dating runtime client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-runtime-client-check
      - name: Golfsim client snapshot is fresh
        working-directory: examples/golfsim
        run: mise exec zig@0.16.0 -- zig build gen-client-check
      - name: Build plugins example consumer (advanced framework surface)
        run: cd examples/plugins && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v7
        with:
          name: zigbase-binaries
          path: |
            zig-out/bin/zigbase
            zig-out/bin/dating-server
            examples/blog/zig-out/bin/blog
            examples/golfsim/zig-out/bin/golfsim
            examples/plugins/zig-out/bin/plugins
          if-no-files-found: error
          retention-days: 1

  unit:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      # Persists the compiled SQLite object (and the test binary) across runs — see the
      # build job for rationale. Separate key prefix: the test binary differs from the
      # build job's artifacts, so they don't share cache entries.
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-unit-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-unit-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-unit-${{ runner.os }}-zig0.16.0-
      - name: Unit tests
        run: mise exec zig@0.16.0 -- zig build test --summary all
      - name: "Unit tests (prod gate: -Ddev-clock=false)"
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ddev-clock=false

  # Opt-in PostgreSQL backend (#159). Runs the full suite WITH -Dpostgres=true against a
  # real postgres service container, exercising the pure-Zig wire driver's SCRAM-SHA-256
  # auth + extended-protocol query/transaction/pool tests. The container forces SCRAM
  # (POSTGRES_HOST_AUTH_METHOD=scram-sha-256); ZIGBASE_PG_TEST_URL points the live tests at
  # it. The default SQLite jobs above are untouched, so the default story can't regress.
  postgres:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      # sslmode=prefer: the stock postgres image has no server TLS, so the driver negotiates
      # SSLRequest and transparently falls back to plaintext. SCRAM is still exercised here;
      # TLS-handshake coverage runs against a TLS-enabled local PostgreSQL during development.
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=prefer
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zbpg
          POSTGRES_PASSWORD: zbpg_secret_pw
          POSTGRES_DB: zbpgtest
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zbpg -d zbpgtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-postgres-${{ runner.os }}-zig0.16.0-
      - name: Unit + PostgreSQL driver tests (-Dpostgres=true)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true

  # PostgreSQL with server TLS, so the suite runs over a REAL sslmode=require connection —
  # exercising the TLS handshake, the dual-layer flushOut, and TLS partial-read framing (the
  # exact area a flush hang already bit). The stock service-container image has no TLS, so we
  # run our own PG via `docker run` with a generated self-signed cert + scram-sha-256.
  postgres-tls:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=require
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache zig local cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-local
          key: zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-${{ github.sha }}
          restore-keys: |
            zig-local-postgres-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}-
            zig-local-postgres-${{ runner.os }}-zig0.16.0-
      - name: Start PostgreSQL with server TLS + SCRAM
        run: |
          mkdir -p "$PWD/pgtls"
          openssl req -new -x509 -days 2 -nodes -text \
            -subj "/CN=localhost" \
            -out "$PWD/pgtls/server.crt" -keyout "$PWD/pgtls/server.key"
          chmod 600 "$PWD/pgtls/server.key"
          # The postgres image runs as uid 999; it must own the key to load it.
          sudo chown 999:999 "$PWD/pgtls/server.crt" "$PWD/pgtls/server.key"
          docker run -d --name pgtls \
            -e POSTGRES_USER=zbpg -e POSTGRES_PASSWORD=zbpg_secret_pw -e POSTGRES_DB=zbpgtest \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 5432:5432 \
            -v "$PWD/pgtls/server.crt":/etc/pgtls/server.crt:ro \
            -v "$PWD/pgtls/server.key":/etc/pgtls/server.key:ro \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/etc/pgtls/server.crt -c ssl_key_file=/etc/pgtls/server.key
          # Wait until the server accepts connections.
          for i in $(seq 1 30); do
            if docker exec pgtls pg_isready -U zbpg -d zbpgtest >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done
          # Sanity: confirm SSL is actually on.
          docker exec pgtls psql -U zbpg -d zbpgtest -tAc "SHOW ssl;"
      - name: Unit + PostgreSQL driver tests over TLS (sslmode=require)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pgtls || true

  browser:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: zigbase-binaries
          path: artifacts
      - name: Export prebuilt binary paths
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
      - name: Install Python test deps + resolve Playwright version
        id: pw
        run: |
          mise exec python@3.13 -- python -m pip install --quiet pytest playwright aiosmtpd
          echo "version=$(mise exec python@3.13 -- python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser (chromium headless shell)
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium headless shell + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mise exec python@3.13 -- python -m playwright install --with-deps --only-shell chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mise exec python@3.13 -- python -m playwright install-deps chromium
      - name: Headless browser tests
        run: mise exec python@3.13 -- python -m pytest tests/admin -q
      - name: Live SMTP-over-TLS (STARTTLS) delivery test
        run: mise exec python@3.13 -- python -m pytest tests/smtp -q

  ts-sdk:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: zigbase-binaries
          path: artifacts
      - name: Export prebuilt binary path
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/zig-out/bin/dating-server \
                   artifacts/examples/golfsim/zig-out/bin/golfsim \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_DATING_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/dating-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_GOLFSIM_BINARY=$GITHUB_WORKSPACE/artifacts/examples/golfsim/zig-out/bin/golfsim" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install SDK deps
        working-directory: clients/typescript
        run: mise exec node@24 -- npm ci || mise exec node@24 -- npm install
      - name: Typecheck
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run typecheck
      - name: Unit tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm test
      - name: Integration tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run test:integration
      - name: Build @zigbase/client (golfsim consumes the built package)
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run build
      - name: Golfsim e2e
        working-directory: examples/golfsim
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Blog e2e (base SDK)
        working-directory: examples/blog
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Plugins typegen e2e (runtime SDK)
        working-directory: examples/plugins
        run: mise exec node@24 -- npm install && mise exec node@24 -- npm run typecheck && mise exec node@24 -- npm run test:e2e
      - name: Server package generator unit test
        run: cd clients/typescript/npm && mise exec node@24 -- node --test gen-server-packages.test.mjs
