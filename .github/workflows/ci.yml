name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Only portable runtime artifacts belong on the browser/SDK dependency path.
  # baseline CPU is required: producer and consumer runners can differ.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bundle: [core, examples]
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: ${{ matrix.bundle == 'examples' && 'zig node' || 'zig' }}
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache npm downloads
        if: matrix.bundle == 'examples'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Build plugins example frontend (embedded into the plugins binary)
        if: matrix.bundle == 'examples'
        run: cd examples/plugins/frontend && ./build.sh
      - name: Build Golfsim frontend
        if: matrix.bundle == 'examples'
        run: cd examples/golfsim/frontend && ./build.sh
      - name: Build portable runtime fixtures (two compiler workers)
        if: matrix.bundle == 'core'
        run: >-
          mise exec zig@0.16.0 -- zig build install dating-server auth2-server
          features-fixture admission-fixture feature-remapped-fixture
          feature-disabled-fixture import-fixture full-fixture
          -Dcpu=baseline -j2 --summary all
      - name: Build blog example consumer (dependency-graph proof)
        if: matrix.bundle == 'examples'
        run: cd examples/blog && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build golfsim example consumer (realistic app)
        if: matrix.bundle == 'examples'
        run: cd examples/golfsim && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build plugins example consumer (advanced framework surface)
        if: matrix.bundle == 'examples'
        run: cd examples/plugins && mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Pack core runtime paths
        if: matrix.bundle == 'core'
        run: tar -cf runtime-core.tar zig-out/bin
      - name: Pack example runtime paths
        if: matrix.bundle == 'examples'
        run: >-
          tar -cf runtime-examples.tar
          examples/blog/zig-out/bin/blog
          examples/golfsim/zig-out/bin/golfsim
          examples/golfsim/frontend/dist
          examples/plugins/zig-out/bin/plugins
      - name: Upload prebuilt binaries
        uses: actions/upload-artifact@v7
        with:
          name: zigbase-binaries-${{ matrix.bundle }}
          path: runtime-${{ matrix.bundle }}.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 1

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: zig python node
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Build main zigbase binary
        run: mise exec zig@0.16.0 -- zig build -Dcpu=baseline
      - name: Build lean gating fixture
        run: mise exec zig@0.16.0 -- zig build minimal-server
      - name: Build full gating fixture (positive control; also the browser suite's analytics-enabled fixture)
        run: mise exec zig@0.16.0 -- zig build full-fixture -Dcpu=baseline
      - name: Build zigbase binary without dev-tools (custom-build proof; not a published artifact)
        run: mise exec zig@0.16.0 -- zig build -Dcpu=baseline -Ddev-tools=false -p zig-out-devtools-off
      - name: Blog example in-process tests (zigbase.testing)
        run: cd examples/blog && mise exec zig@0.16.0 -- zig build test --summary all
      - name: Golfsim example in-process tests (zigbase.testing)
        run: |
          cd examples/golfsim/frontend
          ./build.sh
          cd ../
          mise exec zig@0.16.0 -- zig build test --summary all
      - name: Consumer route compile-fail contracts
        run: mise exec zig@0.16.0 -- zig build check-route-contracts -Dcpu=baseline
      - name: Scheduler and memory-worker compile-fail contracts
        run: mise exec zig@0.16.0 -- zig build check-scheduler-contracts check-memory-job-contracts -Dcpu=baseline
      - name: Admission and realtime compile contracts
        run: mise exec zig@0.16.0 -- zig build check-admission-contracts check-realtime-cap-contracts
      - name: Disabled agent CLI rejects discovery and diagnostics
        run: mise exec python@3.13 -- python scripts/check-disabled-agent-cli.py zig-out-devtools-off/bin/zigbase
      - name: Gating invariant (absent-symbols check)
        run: ./scripts/check-gating.sh
      - name: Allocator ownership contracts (ratchet)
        run: ./scripts/check-allocator-contracts.sh
      - name: Error-code ledger is append-only
        run: ./scripts/check-error-code-ledger.sh origin/main
      - name: Doctor check-id ledger is append-only
        run: ./scripts/check-doctor-ledger.sh origin/main
      - name: Changelog fragments are valid
        run: ./scripts/assemble-changelog.sh --dry-run >/dev/null

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig python
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Realtime fanout benchmark correctness (no timing threshold)
        run: mise exec zig@0.16.0 -- zig build bench -Dbench-optimize=ReleaseSafe -- --realtime-only --json
      - name: Binary size and allocation contracts (no timing threshold)
        run: mise exec python@3.13 zig@0.16.0 -- bash scripts/check-performance.sh > performance-contract-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-contract-report
          path: performance-contract-report.json
          if-no-files-found: ignore

  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig python dart java gradle
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Dating client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-client-check
      - name: Dating runtime client snapshot is fresh
        run: mise exec zig@0.16.0 -- zig build gen-dating-runtime-client-check
      - name: Dating Dart client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-dart-client
          mise exec dart@3.12 -- dart format --language-version=3.5 clients/dart/test/codegen/dating/zbase.gen.dart
          git diff --exit-code clients/dart/test/codegen/dating/zbase.gen.dart
      - name: Dating Python client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-python-client
          mise exec python@3.13 -- python -m pip install --quiet ruff==0.15.21
          mise exec python@3.13 -- python -m ruff format clients/python/tests/codegen/dating/zbase_gen.py
          git diff --exit-code clients/python/tests/codegen/dating/zbase_gen.py
      - name: Dating Kotlin client snapshot is fresh
        run: |
          mise exec zig@0.16.0 -- zig build gen-dating-kotlin-client
          mise exec gradle@9.6 -- gradle -p clients/kotlin spotlessApply
          git diff --exit-code clients/kotlin/src/test/kotlin/io/github/valthon/zigbase/codegen/dating/ZbaseGen.kt
      - name: Golfsim client snapshot is fresh
        working-directory: examples/golfsim
        run: mise exec zig@0.16.0 -- zig build gen-client-check

  unit:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig@0.16.0
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Formatting gate (zig fmt --check)
        run: mise exec zig@0.16.0 -- zig fmt --check src build.zig
      - name: Unit tests
        run: mise exec zig@0.16.0 -- zig build test --summary all
      - name: Compile fuzz harnesses
        run: mise exec zig@0.16.0 -- zig build fuzz-compile --summary all
      - name: "Unit tests (prod gate: -Ddev-mode=false)"
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ddev-mode=false
      # Lean custom-build gate: -Ddev-tools=false must still compile AND pass the full
      # suite — proves the stripped configuration (no init/agents-md/typegen; see
      # src/devtools.zig) doesn't rot silently. NOT how we build our own published
      # artifacts (those stay at the default, dev-tools on); this is the configuration
      # a consumer opts into for their own custom build.
      - name: "Unit tests (custom-build gate: -Ddev-tools=false)"
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ddev-tools=false
      # Lean-build gate (R2-6): -Dfts5=false must still COMPILE — the whole point is that FTS5 (and
      # SQLite's -DSQLITE_ENABLE_FTS5) folds out of a build that never declares a `.searchable`
      # field. Build-only, not a full test run: a handful of pre-existing fixtures (policy.zig,
      # rewrap.zig, codegen/typegen_cli.zig) construct a searchable collection unconditionally and
      # would need their own -Dfts5-awareness to pass here — the comptime-dead-code guarantee and
      # fts.zig's own "enabled reflects build_options" test are what this flag actually needs proven.
      - name: "Build check: -Dfts5=false (lean build without SQLite FTS5)"
        run: mise exec zig@0.16.0 -- zig build -Dfts5=false

  # Opt-in PostgreSQL backend (#159). Runs the full suite WITH -Dpostgres=true against a
  # real postgres service container, exercising the pure-Zig wire driver's SCRAM-SHA-256
  # auth + extended-protocol query/transaction/pool tests. The container forces SCRAM
  # (POSTGRES_HOST_AUTH_METHOD=scram-sha-256); ZIGBASE_PG_TEST_URL points the live tests at
  # it. The default SQLite jobs above are untouched, so the default story can't regress.

  postgres:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      # sslmode=prefer: the stock postgres image has no server TLS, so the driver negotiates
      # SSLRequest and transparently falls back to plaintext. SCRAM is still exercised here;
      # TLS-handshake + verification coverage runs in the postgres-tls job.
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=prefer
      ZIGBASE_RAILS_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=prefer
      # No server TLS in this job: gates the live test asserting the DEFAULT (verify-full)
      # refuses a plaintext-only server with the actionable "server refused TLS" error.
      ZIGBASE_PG_PLAINTEXT: "1"
    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension AVAILABLE (#159, PR-11), so
        # the -Dvector live tests can `CREATE EXTENSION vector` (POSTGRES_USER is a superuser here)
        # and exercise the pgvector KNN lowering. Identical env/health to the stock postgres:16.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: zbpg
          POSTGRES_PASSWORD: zbpg_secret_pw
          POSTGRES_DB: zbpgtest
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zbpg -d zbpgtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig@0.16.0 python@3.13
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Unit + PostgreSQL driver tests (-Dpostgres=true -Dvector=true)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true -Dvector=true
      - name: Rails PostgreSQL row-source integration
        run: |
          mise exec python@3.13 -- python -m pip install --quiet pytest -r tools/rails/requirements-postgres.txt
          mise exec python@3.13 -- python -m pytest tests/rails/test_postgres_source.py -q

  # PostgreSQL with server TLS, so the suite runs over a REAL sslmode=require connection —
  # exercising the TLS handshake, the dual-layer flushOut, and TLS partial-read framing (the
  # exact area a flush hang already bit). The stock service-container image has no TLS, so we
  # run our own PG via `docker run` with a generated self-signed cert + scram-sha-256.

  postgres-tls:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      ZIGBASE_PG_TEST_URL: postgres://zbpg:zbpg_secret_pw@127.0.0.1:5432/zbpgtest?sslmode=require
      # Points the live verify-full tests at the self-signed server cert generated below.
      ZIGBASE_PG_TLS_CA: ${{ github.workspace }}/pgtls/server.crt
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig@0.16.0
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Start PostgreSQL with server TLS + SCRAM
        run: |
          mkdir -p "$PWD/pgtls"
          openssl req -new -x509 -days 2 -nodes -text \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -out "$PWD/pgtls/server.crt" -keyout "$PWD/pgtls/server.key"
          chmod 600 "$PWD/pgtls/server.key"
          # The postgres image runs as uid 999; it must own the key to load it.
          sudo chown 999:999 "$PWD/pgtls/server.crt" "$PWD/pgtls/server.key"
          docker run -d --name pgtls \
            -e POSTGRES_USER=zbpg -e POSTGRES_PASSWORD=zbpg_secret_pw -e POSTGRES_DB=zbpgtest \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            -e POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 \
            -p 5432:5432 \
            -v "$PWD/pgtls/server.crt":/etc/pgtls/server.crt:ro \
            -v "$PWD/pgtls/server.key":/etc/pgtls/server.key:ro \
            postgres:16 \
            -c ssl=on -c ssl_cert_file=/etc/pgtls/server.crt -c ssl_key_file=/etc/pgtls/server.key
          # Wait until the server accepts connections.
          for i in $(seq 1 30); do
            if docker exec pgtls pg_isready -U zbpg -d zbpgtest >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done
          # Sanity: confirm SSL is actually on.
          docker exec pgtls psql -U zbpg -d zbpgtest -tAc "SHOW ssl;"
      - name: Unit + PostgreSQL driver tests over TLS (sslmode=require)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Dpostgres=true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f pgtls || true

  # Opt-in S3 storage backend (§D). Builds and tests with -Ds3=true against a real
  # SeaweedFS started via `docker run` with a pre-created bucket. Default jobs
  # keep the stock flags, so both configurations compile on every PR (the
  # postgres two-config precedent).

  s3:
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
      ZIGBASE_S3_TEST_ENDPOINT: http://127.0.0.1:9000
      ZIGBASE_S3_TEST_BUCKET: zbtest
      ZIGBASE_S3_TEST_KEY: minioadmin
      ZIGBASE_S3_TEST_SECRET: minioadmin
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig@0.16.0 python@3.13
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Start SeaweedFS + wait for authenticated bucket access
        run: |
          # SeaweedFS 4.46; pin the manifest digest rather than a mutable tag.
          docker run -d --name seaweedfs -p 127.0.0.1:9000:8333 \
            -e AWS_ACCESS_KEY_ID="$ZIGBASE_S3_TEST_KEY" \
            -e AWS_SECRET_ACCESS_KEY="$ZIGBASE_S3_TEST_SECRET" \
            -e S3_BUCKET="$ZIGBASE_S3_TEST_BUCKET" \
            chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62 \
            mini -dir=/data -master.telemetry=false -admin.ui=false \
            -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
          for i in $(seq 1 30); do
            if curl --fail --silent --head --max-time 2 \
              --aws-sigv4 aws:amz:us-east-1:s3 \
              --user "$ZIGBASE_S3_TEST_KEY:$ZIGBASE_S3_TEST_SECRET" \
              "$ZIGBASE_S3_TEST_ENDPOINT/$ZIGBASE_S3_TEST_BUCKET" >/dev/null; then
              echo "SeaweedFS bucket ready"
              exit 0
            fi
            sleep 2
          done
          echo "SeaweedFS bucket did not become ready" >&2
          exit 1
      - name: Unit + live S3 tests (-Ds3=true)
        run: mise exec zig@0.16.0 -- zig build test --summary all -Ds3=true -Dfile-inventory=true
      - name: Build zigbase (-Ds3=true) for the raw-HTTP e2e
        run: mise exec zig@0.16.0 -- zig build -Ds3=true -Dfile-inventory=true -Dcpu=baseline
      - name: Inventory build-flag gating (absent and positive controls)
        run: |
          mise exec zig@0.16.0 -- zig build -Dfile-inventory=false -Dcpu=baseline -p zig-out-inventory-off
          bash scripts/check-gating.sh --inventory zig-out-inventory-off/bin/zigbase zig-out/bin/zigbase
      - name: Install Python S3 and inventory test dependencies
        run: mise exec python@3.13 -- python -m pip install --quiet pytest
      - name: Storage inventory and offline reconciliation CLI
        run: ZIGBASE_TEST_INVENTORY_BINARY="$PWD/zig-out/bin/zigbase" mise exec python@3.13 -- python -m pytest tests/cli/test_file_inventory.py tests/cli/test_file_reconcile.py -q
      - name: S3 end-to-end (upload -> Range/304/416 -> delete)
        run: |
          ZIGBASE_TEST_BINARY="$PWD/zig-out/bin/zigbase" \
            mise exec python@3.13 -- python -m pytest tests/s3 -q
      - name: SeaweedFS logs on failure
        if: failure()
        run: docker logs seaweedfs || true
      - name: Stop SeaweedFS
        if: always()
        run: docker rm -fv seaweedfs || true


  ts-sdk:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node@24
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          pattern: zigbase-binaries-*
          merge-multiple: true
          path: artifacts
      - name: Unpack prebuilt runtime paths
        run: |
          for bundle in core examples; do
            tar -xf "artifacts/runtime-$bundle.tar" -C artifacts
          done
      - name: Export prebuilt binary path
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/zig-out/bin/dating-server \
                   artifacts/zig-out/bin/auth2-server \
                   artifacts/examples/golfsim/zig-out/bin/golfsim \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_DATING_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/dating-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_AUTH2_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/auth2-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_GOLFSIM_BINARY=$GITHUB_WORKSPACE/artifacts/examples/golfsim/zig-out/bin/golfsim" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install SDK deps
        working-directory: clients/typescript
        run: mise exec node@24 -- npm ci || mise exec node@24 -- npm install
      - name: Typecheck
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run typecheck
      - name: Unit tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm test
      - name: Integration tests
        working-directory: clients/typescript
        run: mise exec node@24 -- npm run test:integration
