  feature-tests:
    # These are distinct configuration checks, not duplicates of default units.
    # Build locally so no feature lane waits for unrelated portable artifacts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [workbench, thumbnails, resumable, durable, coordination]
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: ${{ matrix.lane == 'thumbnails' && 'zig python node' || 'zig python' }}
      - name: Cache zig global cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.zig-global
          key: zig-global-${{ runner.os }}-zig0.16.0-${{ hashFiles('vendor/sqlite/sqlite3.c', 'build.zig', 'build.zig.zon') }}
          restore-keys: zig-global-${{ runner.os }}-zig0.16.0-
      - name: Install common feature test dependencies
        run: mise exec python@3.13 -- python -m pip install --quiet pytest
      - name: Install thumbnail browser dependency + resolve version
        if: matrix.lane == 'thumbnails'
        id: pw
        run: |
          mise exec python@3.13 -- python -m pip install --quiet playwright
          echo "version=$(mise exec python@3.13 -- python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Install upload test workers
        if: matrix.lane == 'resumable' || matrix.lane == 'durable'
        run: mise exec python@3.13 -- python -m pip install --quiet pytest-xdist
      - name: Build default symbol-gating control
        if: matrix.lane != 'durable'
        run: mise exec zig@0.16.0 -- zig build
      - name: Export default binary path
        if: matrix.lane != 'durable'
        run: echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/zig-out/bin/zigbase" >> "$GITHUB_ENV"
      - name: Build RAM upload symbol-gating control
        if: matrix.lane == 'durable'
        run: mise exec zig@0.16.0 -- zig build resumable-uploads-fixture -Dresumable-uploads=true --prefix zig-out/resumable
      - name: Build Golfsim thumbnail frontend
        if: matrix.lane == 'thumbnails'
        run: cd examples/golfsim/frontend && ./build.sh
      - name: Cache Playwright browser (chromium headless shell)
        if: matrix.lane == 'thumbnails'
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium headless shell + OS deps (cache miss)
        if: matrix.lane == 'thumbnails' && steps.pw-cache.outputs.cache-hit != 'true'
        run: mise exec python@3.13 -- python -m playwright install --with-deps --only-shell chromium
      - name: Install Playwright OS deps (cache hit)
        if: matrix.lane == 'thumbnails' && steps.pw-cache.outputs.cache-hit == 'true'
        run: mise exec python@3.13 -- python -m playwright install-deps chromium
      - name: Opt-in bounded SQLite query workbench
        if: matrix.lane == 'workbench'
        run: |
          mise exec zig@0.16.0 -- zig build check-query-workbench-contracts
          mise exec zig@0.16.0 -- zig build test -Dquery-workbench=true --summary all
          mise exec zig@0.16.0 -- zig build query-workbench-fixture check-query-workbench-contracts -Dquery-workbench=true --prefix zig-out/workbench
          bash scripts/check-query-workbench-gating.sh "$ZIGBASE_TEST_BINARY" zig-out/workbench/bin/query-workbench-fixture
          ZIGBASE_TEST_QUERY_WORKBENCH_BINARY="$GITHUB_WORKSPACE/zig-out/workbench/bin/query-workbench-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_query_workbench.py -q
      - name: Install optional thumbnail test dependency
        if: matrix.lane == 'thumbnails'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Opt-in ImageMagick thumbnail regressions and gating
        if: matrix.lane == 'thumbnails'
        run: |
          mise exec zig@0.16.0 -- zig build check-thumbnail-contracts
          mise exec zig@0.16.0 -- zig build check-thumbnail-contracts -Dimage-thumbnails=true
          mise exec zig@0.16.0 -- zig build test -Dimage-thumbnails=true --summary all
          mise exec zig@0.16.0 -- zig build thumbnails-fixture -Dimage-thumbnails=true --prefix zig-out/thumbnails
          bash scripts/check-gating.sh --image-thumbnails "$ZIGBASE_TEST_BINARY" zig-out/thumbnails/bin/thumbnails-fixture
          ZIGBASE_TEST_THUMBNAILS_BINARY="$GITHUB_WORKSPACE/zig-out/thumbnails/bin/thumbnails-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_thumbnails.py -q
          mise exec python@3.13 -- python -m pytest examples/golfsim/test/test_thumbnail_gallery.py -q
      - name: Thumbnail-enabled Golfsim consumer
        if: matrix.lane == 'thumbnails'
        working-directory: examples/golfsim
        run: |
          mise exec zig@0.16.0 -- zig build -Dimage-thumbnails=true --summary all
          mise exec zig@0.16.0 -- zig build test gen-client-check -Dimage-thumbnails=true --summary all
      - name: Opt-in resumable upload regressions and gating
        if: matrix.lane == 'resumable'
        run: |
          mise exec zig@0.16.0 -- zig build check-resumable-contracts
          mise exec zig@0.16.0 -- zig build check-resumable-contracts -Dresumable-uploads=true
          mise exec zig@0.16.0 -- zig build test -Dresumable-uploads=true --summary all
          mise exec zig@0.16.0 -- zig build resumable-uploads-fixture -Dresumable-uploads=true --prefix zig-out/resumable
          bash scripts/check-gating.sh --resumable-uploads "$ZIGBASE_TEST_BINARY" zig-out/resumable/bin/resumable-uploads-fixture
          ZIGBASE_TEST_UPLOADS_OFF_BINARY="$ZIGBASE_TEST_BINARY" ZIGBASE_TEST_RESUMABLE_BINARY="$GITHUB_WORKSPACE/zig-out/resumable/bin/resumable-uploads-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_resumable_uploads.py -q -n 2 --dist load --durations=20
      - name: SQLite upload restart recovery and persistence gating
        if: matrix.lane == 'durable'
        run: |
          mise exec zig@0.16.0 -- zig build test durable-uploads-fixture check-resumable-contracts -Dresumable-uploads=true -Ddurable-resumable-uploads=true --prefix zig-out/durable-uploads --summary all
          bash scripts/check-gating.sh --durable-uploads zig-out/resumable/bin/resumable-uploads-fixture zig-out/durable-uploads/bin/durable-uploads-fixture
          ZIGBASE_TEST_DURABLE_UPLOADS_BINARY="$GITHUB_WORKSPACE/zig-out/durable-uploads/bin/durable-uploads-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_durable_uploads.py -q -n 2 --dist load --durations=20
      - name: Opt-in realtime backfill regressions
        if: matrix.lane == 'coordination'
        run: |
          mise exec zig@0.16.0 -- zig build -Drealtime-backfill=true --prefix zig-out/backfill
          ZIGBASE_TEST_BACKFILL_BINARY="$GITHUB_WORKSPACE/zig-out/backfill/bin/zigbase" mise exec python@3.13 -- python -m pytest tests/admin/test_realtime_backfill.py -q
      - name: SQLite consumer migration process coordination
        if: matrix.lane == 'coordination'
        run: |
          mise exec zig@0.16.0 -- zig build migration-coordination-fixture
          ZIGBASE_TEST_MIGRATION_COORDINATION_BINARY="$GITHUB_WORKSPACE/zig-out/bin/migration-coordination-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_migration_coordination.py -q
      - name: Opt-in idempotent custom mutations
        if: matrix.lane == 'coordination'
        run: |
          mise exec zig@0.16.0 -- zig build idempotency-fixture check-idempotency-contracts
          bash scripts/check-idempotency-gating.sh "$ZIGBASE_TEST_BINARY" zig-out/bin/idempotency-fixture
          ZIGBASE_TEST_IDEMPOTENCY_BINARY="$GITHUB_WORKSPACE/zig-out/bin/idempotency-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_idempotency.py -q
      - name: Configurable memory-job worker resources
        if: matrix.lane == 'coordination'
        run: |
          mise exec zig@0.16.0 -- zig build memory-jobs-fixture
          ZIGBASE_TEST_MEMORY_JOBS_BINARY="$GITHUB_WORKSPACE/zig-out/bin/memory-jobs-fixture" mise exec python@3.13 -- python -m pytest tests/admin/test_memory_jobs.py -q

  # Keep the existing required check fail-closed across all split lanes.
  browser:
    if: always()
    needs: [build, browser-tests, cli-tests, feature-tests, contracts, performance, codegen]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every lane to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
