  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-local
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: zig python node
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          pattern: zigbase-binaries-*
          merge-multiple: true
          path: artifacts
      - name: Unpack prebuilt runtime paths
        run: |
          for bundle in core examples; do
            tar -xf "artifacts/runtime-$bundle.tar" -C artifacts
          done
      - name: Export prebuilt binary paths
        run: |
          chmod +x artifacts/zig-out/bin/zigbase \
                   artifacts/zig-out/bin/auth2-server \
                   artifacts/examples/blog/zig-out/bin/blog \
                   artifacts/examples/plugins/zig-out/bin/plugins
          echo "ZIGBASE_TEST_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/zigbase" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_AUTH2_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/auth2-server" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/dating-server
          echo "ZIGBASE_TEST_DATING_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/dating-server" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_BLOG_BINARY=$GITHUB_WORKSPACE/artifacts/examples/blog/zig-out/bin/blog" >> "$GITHUB_ENV"
          chmod +x artifacts/examples/golfsim/zig-out/bin/golfsim
          echo "ZIGBASE_TEST_GOLFSIM_BINARY=$GITHUB_WORKSPACE/artifacts/examples/golfsim/zig-out/bin/golfsim" >> "$GITHUB_ENV"
          cp -R artifacts/examples/golfsim/frontend/dist examples/golfsim/frontend/dist
          echo "ZIGBASE_TEST_PLUGINS_BINARY=$GITHUB_WORKSPACE/artifacts/examples/plugins/zig-out/bin/plugins" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/features-fixture
          echo "ZIGBASE_FEATURES_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/features-fixture" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/feature-remapped-fixture artifacts/zig-out/bin/feature-disabled-fixture
          echo "ZIGBASE_TEST_FEATURE_REMAPPED_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/feature-remapped-fixture" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_FEATURE_DISABLED_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/feature-disabled-fixture" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/import-fixture
          echo "ZIGBASE_TEST_IMPORT_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/import-fixture" >> "$GITHUB_ENV"
          chmod +x artifacts/zig-out/bin/full-fixture
          chmod +x artifacts/zig-out/bin/admission-fixture
          echo "ZIGBASE_TEST_ADMISSION_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/admission-fixture" >> "$GITHUB_ENV"
          echo "ZIGBASE_TEST_FULL_BINARY=$GITHUB_WORKSPACE/artifacts/zig-out/bin/full-fixture" >> "$GITHUB_ENV"
      - name: Install Python test deps + resolve Playwright version
        id: pw
        run: |
          mise exec python@3.13 -- python -m pip install --quiet pytest pytest-xdist playwright
          echo "version=$(mise exec python@3.13 -- python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser (chromium headless shell)
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium-shell
      - name: Install Chromium headless shell + OS deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: mise exec python@3.13 -- python -m playwright install --with-deps --only-shell chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: mise exec python@3.13 -- python -m playwright install-deps chromium
      - name: Headless browser tests
        run: mise exec python@3.13 -- python -m pytest tests/admin -q -n auto
      - name: Blog Zigapagos browser flow
        working-directory: examples/blog
        run: |
          mise exec node@24 -- npm install
          mise exec node@24 -- npm run build:frontend
          mise exec python@3.13 -- python test/frontend.browser.py

  cli-tests:
    runs-on: ubuntu-latest
