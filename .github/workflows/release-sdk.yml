# TypeScript SDK release: publishes @zigbase/client to npm on a `client-v*` tag.
# The SDK is versioned INDEPENDENTLY of the server (which uses `vX.Y.Z` tags).
# Publishes via OIDC trusted publishing (no token) — a per-package trusted
# publisher for this workflow must be configured on npmjs.com.
# See clients/typescript/RELEASING.md.
name: Release SDK

on:
  push:
    tags:
      - "client-v*"

permissions:
  contents: read
  id-token: write # npm provenance / OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          # node 24 (the repo's mise pin) ships npm >= 11.5, required for OIDC
          # trusted publishing; node 22 ships npm 10.x which lacks it.
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Typecheck
        working-directory: clients/typescript
        run: npm run typecheck

      - name: Test
        working-directory: clients/typescript
        run: npm test

      - name: Build
        working-directory: clients/typescript
        run: npm run build

      - name: Assert package.json version matches the tag
        working-directory: clients/typescript
        run: |
          tag="${GITHUB_REF_NAME}"
          expected="${tag#client-v}"
          actual="$(node -p "require('./package.json').version")"
          echo "tag=$tag expected=$expected package.json=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag ($tag => $expected) does not match package.json version ($actual)."
            exit 1
          fi

      # Publishes via OIDC trusted publishing (no NODE_AUTH_TOKEN): npm sees no
      # token and authenticates through the GitHub Actions id-token. A trusted
      # publisher for this workflow must be configured on npmjs.com first.
      - name: Publish to npm
        working-directory: clients/typescript
        run: npm publish --provenance --access public
